<div class="home-card">
  <header class="home-header">
    <h1 class="home-greeting">Welcome, {{ authStore.currentUser()?.username ?? 'User' }}</h1>
    <span class="home-role">{{ authStore.currentUser()?.role ?? '' }}</span>
  </header>

  <p class="home-info">
    You are signed in to <strong>MediBridge</strong>.
    This is a protected page — only visible when your session is active.
  </p>

  <button type="button" class="logout-btn" (click)="logout()">Logout</button>
</div>
