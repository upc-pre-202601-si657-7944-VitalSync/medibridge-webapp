<div class="home-card">
  <header class="home-header">
    <h1 class="home-greeting">{{ 'auth.home.welcome' | translate }}, {{ authStore.currentUser()?.username ?? 'User' }}</h1>
    <span class="home-role">{{ authStore.currentUser()?.role ?? '' }}</span>
  </header>

  <p class="home-info">
    {{ 'auth.home.info' | translate }}
  </p>

  <button type="button" class="logout-btn" (click)="logout()">{{ 'auth.home.logout' | translate }}</button>
</div>
