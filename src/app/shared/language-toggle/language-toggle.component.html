<div class="lang-toggle" role="group" aria-label="Language selector">
  <button
    type="button"
    class="lang-btn"
    [class.active]="currentLocale() === 'es'"
    (click)="setLocale('es')"
    aria-label="Español"
  >
    ES
  </button>
  <button
    type="button"
    class="lang-btn"
    [class.active]="currentLocale() === 'en'"
    (click)="setLocale('en')"
    aria-label="English"
  >
    EN
  </button>
</div>
